# Stack local del PR3 — Infraestructures educatives
# Aixecar:  docker compose up -d
# Aturar:   docker compose down        (afegir -v per esborrar dades)

name: pr3-infra

services:

  # ─────────────────────────────────────────────────────────────
  # PostgreSQL — base de dades operacional (OLTP) + capa Bronze
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pr3-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pr3}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pr3_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-infraedu}
      # Locale ca_ES no cal: forcem UTF8 i ordenació determinista
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Tot el que hi hagi a ./sql s'executa EN ORDRE ALFABÈTIC
      # el primer cop que es crea el volum (i només el primer cop).
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pr3} -d ${POSTGRES_DB:-infraedu}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [pr3net]

  # ─────────────────────────────────────────────────────────────
  # Zookeeper — coordinació de Kafka
  # ─────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: pr3-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep -q Mode"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [pr3net]

  # ─────────────────────────────────────────────────────────────
  # Kafka — broker d'esdeveniments
  #
  # ATENCIÓ als dos listeners. Aquest és EL punt on tothom encalla:
  #   · kafka:29092   → per a clients DINS de la xarxa Docker (Flink)
  #   · localhost:9092 → per al teu productor Python a Windows
  # Si el productor apunta a kafka:29092 des de Windows, no resoldrà
  # el nom. Si Flink apunta a localhost:9092, es buscarà a si mateix.
  # ─────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: pr3-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [pr3net]

  # ─────────────────────────────────────────────────────────────
  # Kafka UI — inspecció visual de topics (http://localhost:8081)
  # No és imprescindible però et farà guanyar molt temps depurant.
  # ─────────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: pr3-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: pr3-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    networks: [pr3net]

  # ─────────────────────────────────────────────────────────────
  # Flink JobManager — coordinador + UI a http://localhost:8082
  # ─────────────────────────────────────────────────────────────
  flink-jobmanager:
    build:
      context: ./docker/flink
      dockerfile: Dockerfile
    image: pr3/flink:1.18.1-py
    container_name: pr3-flink-jm
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8082:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: 2
        execution.checkpointing.interval: 30s
        state.backend: hashmap
      - PG_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-infraedu}
      - PG_USER=${POSTGRES_USER:-pr3}
      - PG_PASSWORD=${POSTGRES_PASSWORD:-pr3_local_dev}
      - KAFKA_BOOTSTRAP=kafka:29092
    volumes:
      - ./flink_jobs:/opt/flink_jobs
    networks: [pr3net]

  # ─────────────────────────────────────────────────────────────
  # Flink TaskManager — worker que executa realment les tasques
  # ─────────────────────────────────────────────────────────────
  flink-taskmanager:
    image: pr3/flink:1.18.1-py
    container_name: pr3-flink-tm
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2
      - PG_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-infraedu}
      - PG_USER=${POSTGRES_USER:-pr3}
      - PG_PASSWORD=${POSTGRES_PASSWORD:-pr3_local_dev}
      - KAFKA_BOOTSTRAP=kafka:29092
    volumes:
      - ./flink_jobs:/opt/flink_jobs
    networks: [pr3net]

volumes:
  pgdata:

networks:
  pr3net:
    driver: bridge
