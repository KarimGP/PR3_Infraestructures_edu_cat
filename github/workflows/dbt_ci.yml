# Integracio continua del projecte de dades.
#
# A cada push, GitHub arrenca una maquina temporal amb PostgreSQL,
# construeix l'esquema, carrega dades minimes i executa els 19 models
# de dbt amb els seus 88 tests. Si algun model o test es trenca, el
# push queda marcat amb una creu vermella.
#
# No fem servir les dades reals de l'API de la Generalitat: la CI ha
# de ser rapida i no ha de dependre d'un servei extern que pot estar
# caigut. Es carrega un conjunt minim que satisfa les constraints i
# permet que tots els models compilin i s'executin.

name: dbt CI

on:
  push:
    branches: [main]
    paths:
      - 'dbt_infraedu/**'
      - 'sql/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:        # permet llancar-lo a ma des de GitHub

jobs:
  dbt-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pr3
          POSTGRES_PASSWORD: pr3_ci
          POSTGRES_DB: infraedu
        ports:
          - 5432:5432
        # Sense healthcheck, els passos seguents podrien intentar
        # connectar abans que Postgres accepti connexions.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_USER: pr3
      POSTGRES_PASSWORD: pr3_ci
      POSTGRES_DB: infraedu

    steps:
      - name: Descarrega el codi
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instal·la dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core==1.8.9 dbt-postgres==1.8.2 psycopg2-binary numpy

      - name: Crea l'esquema
        run: |
          PGPASSWORD=$POSTGRES_PASSWORD psql -h localhost -U pr3 -d infraedu \
            -v ON_ERROR_STOP=1 -f sql/01_schema.sql
          PGPASSWORD=$POSTGRES_PASSWORD psql -h localhost -U pr3 -d infraedu \
            -v ON_ERROR_STOP=1 -f sql/02_smoke_test.sql

      - name: Carrega dades minimes
        run: python .github/scripts/seed_ci.py

      - name: Configura el perfil de dbt
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          dbt_infraedu:
            target: ci
            outputs:
              ci:
                type: postgres
                host: localhost
                port: 5432
                user: pr3
                password: pr3_ci
                dbname: infraedu
                schema: dbt
                threads: 4
          EOF

      - name: dbt debug
        working-directory: dbt_infraedu
        run: dbt debug

      - name: dbt run
        working-directory: dbt_infraedu
        run: dbt run

      - name: dbt test
        working-directory: dbt_infraedu
        run: dbt test

      - name: Genera la documentacio
        working-directory: dbt_infraedu
        run: dbt docs generate

      - name: Comprova la sintaxi dels scripts Python
        run: |
          python -m compileall -q scripts producer ml flink_jobs